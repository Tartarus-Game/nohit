<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>haoge-sans 已验证无伤路线 · 一键回放</title>
<style>
  :root { color-scheme: dark; }
  body { background:#0d1117; color:#e6edf3; font:14px/1.6 "Segoe UI",system-ui,sans-serif; margin:0; padding:24px 32px; }
  h1 { font-size:19px; margin:0 0 4px; }
  p.note { color:#8b949e; margin:0 0 18px; max-width:820px; }
  table { border-collapse:collapse; width:100%; max-width:1100px; }
  th,td { text-align:left; padding:7px 10px; border-bottom:1px solid #21262d; }
  th { color:#8b949e; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  button { background:#238636; color:#fff; border:0; border-radius:6px; padding:5px 14px; cursor:pointer; font-size:13px; }
  button:hover { background:#2ea043; }
  button:disabled { background:#30363d; color:#8b949e; cursor:default; }
  #status { margin:14px 0 0; min-height:22px; color:#d29922; }
  code { background:#161b22; padding:1px 5px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
<h1>haoge-sans 已验证无伤路线 · 一键回放</h1>
<p class="note">
  每一行的按钮会把该回合的 CSV 注册进原版 Custom 入口，然后用
  <code>?route=&lt;回合&gt;</code> 在真机里<b>回放已求解并验证过的路线</b>，不再重新求解。
  回放仍然走一遍完整校验：CSV 哈希、时钟表哈希、dt 前缀、动作/Confirm/轨迹形状、原生 EndAttack，
  以及入口边界的第一帧环境。任何一处对不上都会<b>直接报错停下</b>，不会带病播放。
  判定口径：HP 不得低于满血（本构建为 142）；KR 单独记录，因为本构建的脚本会用
  <code>DamagePlayer(-N,1)</code> 做带 1 点 KR 的治疗，而最低扣血档位是 KR&gt;10。
</p>
<p class="note" id="summary"></p>
<button id="demo" disabled style="padding:10px 22px;font-size:15px;margin-bottom:16px">载入中…</button>
<div id="list"></div>
<div id="status"></div>
<script>
// The game's own attack order, taken from the shipped normal campaign.
const ATTACK_ORDER = ['intro','bonegap1','bluebone','bonegap2','platforms1','platforms2',
  'platforms3','platforms4','platformblaster','platforms4hard','bonegap1fast','boneslideh',
  'bonegap2','spare','multi1','randomblaster1','multi2','bonestab1','bonestab2',
  'randomblaster2','boneslidev','multi3','bonestab3','final'];
(async () => {
  const list = document.getElementById('list');
  const status = document.getElementById('status');
  const demoButton = document.getElementById('demo');
  let rounds;
  try {
    const response = await fetch('routes/index.json', { cache: 'no-store' });
    if (!response.ok) throw Error('routes/index.json 不可达');
    rounds = await response.json();
  } catch (error) {
    list.textContent = '载入失败：' + error;
    demoButton.textContent = '载入失败';
    return;
  }
  const byRound = new Map(rounds.map(r => [r.round.replace(/^sans_/, ''), r]));
  const ordered = ATTACK_ORDER.filter(name => byRound.has(name));
  const missing = ATTACK_ORDER.filter(name => !byRound.has(name));
  const totalActions = rounds.reduce((sum, r) => sum + (r.actions || 0), 0);
  const totalSeconds = rounds.reduce((sum, r) => sum + (r.game_seconds || 0), 0);
  document.getElementById('summary').textContent =
    `${rounds.length} 个回合可回放，共 ${totalActions} 步输入、约 ${totalSeconds.toFixed(0)} 秒游戏时间。`
    + (missing.length ? ` 尚无路线的回合：${missing.join('、')}（连续演示会跳过）。` : '');

  demoButton.disabled = false;
  demoButton.textContent = `▶ 开始连续演示（${ordered.length} 回合，自动播放）`;
  demoButton.onclick = async () => {
    demoButton.disabled = true;
    try {
      const entries = [];
      for (let i = 0; i < ordered.length; i++) {
        const name = ordered[i];
        status.textContent = `注册 ${name}（${i + 1}/${ordered.length}）…`;
        const response = await fetch('/api/csv-source', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ csv_path: byRound.get(name).csv_path }),
        });
        const source = await response.json();
        if (!response.ok) throw Error(name + ': ' + (source.error || '注册失败'));
        // The playlist must carry the FULL plan name (`sans_intro`), because that
        // is the plan filename the replay path fetches. A short name here made the
        // auto-advance ask for routes/bonegap1.plan.json, which does not exist.
        entries.push(byRound.get(name).round + ':' + source.id);
      }
      status.textContent = '全部注册完成，进入连续演示…';
      const first = entries[0].split(':');
      location.href = `/game/index.html?csvtas=1&csv_source=${first[1]}`
        + `&route=${first[0]}&attack=custom&custom_acceptance=1&seed=42&fps=30&demo=1`
        + `&playlist=${encodeURIComponent(entries.join('|'))}`;
    } catch (error) {
      status.textContent = '失败：' + error;
      demoButton.disabled = false;
    }
  };

  const table = document.createElement('table');
  table.innerHTML = '<thead><tr><th>回合</th><th>输入步数</th><th>游戏时长</th><th>模型验证</th><th></th></tr></thead>';
  const body = document.createElement('tbody');
  for (const round of rounds) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${round.round}</td>`
      + `<td class="num">${round.actions}</td>`
      + `<td class="num">${round.game_seconds ? round.game_seconds.toFixed(1) + 's' : '-'}</td>`
      + `<td>${round.verified ? '✓' : '—'}</td>`;
    const cell = document.createElement('td');
    const button = document.createElement('button');
    button.textContent = '在真机回放';
    button.onclick = async () => {
      button.disabled = true;
      status.textContent = `正在注册 ${round.round} 的 CSV…`;
      try {
        const response = await fetch('/api/csv-source', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ csv_path: round.csv_path }),
        });
        const source = await response.json();
        if (!response.ok) throw Error(source.error || '注册失败');
        status.textContent = `已注册，正在进入 ${round.round} 的真机回放…`;
        location.href = `/game/index.html?csvtas=1&csv_source=${source.id}`
          + `&route=${round.round}&attack=custom&custom_acceptance=1&seed=42&fps=30&demo=1`;
      } catch (error) {
        status.textContent = '失败：' + error;
        button.disabled = false;
      }
    };
    cell.appendChild(button);
    tr.appendChild(cell);
    body.appendChild(tr);
  }
  table.appendChild(body);
  list.innerHTML = '';
  list.appendChild(table);
})();
</script>
</body>
</html>
